<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hi-Tech Haj Umrah Services — Jalna, Marathwada</title>
    <meta
      name="description"
      content="Haj and Umrah travel services from Jalna serving all eight districts of Marathwada. Umrah packages, visa assistance, air tickets, hotels, ziyarat and on-ground support."
    />

    <!--
      Language entry point for the bare domain root.

      The real site lives at /en and /hi so both languages are independently
      crawlable and can carry their own <html lang>. This document just forwards
      visitors to the default language.

      It is a no-op for anything that arrives with JS disabled or on a crawler
      that does not follow a meta refresh, because the visible body carries the
      real navigation links below.
    -->
    <meta http-equiv="refresh" content="0; url=/en" />
    <link rel="canonical" href="/en" />
    <link rel="alternate" hreflang="en" href="/en" />
    <link rel="alternate" hreflang="hi" href="/hi" />
    <link rel="alternate" hreflang="x-default" href="/en" />

    <style>
      :root { color-scheme: light dark }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        gap: 1.25rem;
        padding: 2rem;
        background: #fbf7ef;
        color: #0b1220;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .mark { font-size: 1.5rem; letter-spacing: 0.22em; font-weight: 700; color: #062e22 }
      .sub { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #0b5d3b }
      nav { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center }
      a {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        background: #0b5d3b;
        color: #fbf7ef;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
      }
      a.alt { background: transparent; color: #0b5d3b; border: 1px solid #0b5d3b40 }
      @media (prefers-color-scheme: dark) {
        body { background: #04180f; color: #fbf7ef }
        .mark { color: #fbf7ef }
        .sub { color: #f0d98a }
      }
    </style>
  </head>
  <body>
    <p class="sub">Haj &amp; Umrah from Jalna, Marathwada</p>
    <p class="mark">HI-TECH</p>
    <p class="sub">हज उमरा सर्विस</p>
    <nav>
      <a href="/en">Continue in English</a>
      <a class="alt" href="/hi">हिंदी में पढ़ें</a>
    </nav>
  </body>
</html>
